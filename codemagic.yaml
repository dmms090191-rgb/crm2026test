# Compilation de Talvex iOS sur un Mac distant, pilotee depuis Windows.
#
# POURQUOI CE FICHIER EXISTE. Produire un .ipa exige xcodebuild et codesign, qui n existent
# que sur macOS. Rien dans ce projet n exige de POSSEDER un Mac : la generation du projet, la
# synchronisation, les icones et la configuration se font toutes sous Windows — elles l ont
# toutes ete. Seules l archive, la signature et l envoi demandent une machine Apple, et c est
# ce que loue le service.
#
# CE FICHIER NE SOUSCRIT A RIEN et ne declenche rien tant que le depot n est pas connecte a un
# compte Codemagic. Il peut rester la sans effet.
#
# ============================= DEUX PIEGES, MESURES =============================
#
# 1. PAS DE `pod install`. Le modele officiel de Codemagic pour Capacitor en contient un.
#    Capacitor 8 est passe a Swift Package Manager : `npx cap add ios` n a produit AUCUN
#    Podfile (verifie le 25/10/2026), et la commande echouerait. La resolution des paquets
#    Swift est faite par xcodebuild lui-meme.
#
# 2. `npm ci` AVANT TOUT. ios/App/CapApp-SPM/Package.swift declare le plugin de coffre par un
#    CHEMIN RELATIF : path: "../../../node_modules/@aparajita/capacitor-secure-storage".
#    Si la resolution Swift tourne avant l installation des dependances npm, ce chemin
#    n existe pas et la compilation s arrete sur une erreur qui ne designe pas sa cause.
#
# ============================= CE QU IL FAUT FOURNIR =============================
#
# Le depot ne contient AUCUN secret, et ne doit jamais en contenir. Deux choses sont donc a
# poser dans l interface de Codemagic, pas ici :
#
#   - le groupe de variables `talvex_web` : VITE_SUPABASE_URL et VITE_SUPABASE_ANON_KEY.
#     Sans elles, `npm run build` produit un paquet qui ne sait pas a quel projet Supabase
#     parler. La cle « anon » est publique par conception — c est la RLS qui protege — mais
#     elle n a pas sa place dans un depot public pour autant.
#   - la cle d API App Store Connect (un fichier .p8), televersee une seule fois. Codemagic
#     s en sert pour creer le certificat de distribution et pour envoyer vers TestFlight.
#     Elle ne se retelecharge jamais chez Apple : a conserver hors du depot (*.p8 est ignore).

# ===================================================================================
# DEUX CHAINES, DEUX BUTS, ET UNE SEULE EXIGE DE PAYER
# ===================================================================================
#
#   talvex-ios-perso   Un .ipa NON SIGNE, pour l iPhone de David et lui seul.
#                      AUCUNE adhesion Apple. AUCUN Mac a louer. Zero euro.
#                      C est la chaine a lancer aujourd hui.
#
#   talvex-ios         Un .ipa SIGNE, envoye sur TestFlight, pour des testeurs.
#                      Exige l adhesion Apple Developer Program a 99 $/an.
#                      Prete, mais en attente de cette decision.
#
# POURQUOI LA PREMIERE SUFFIT POUR TESTER SUR SON PROPRE TELEPHONE. La signature n a pas
# besoin d avoir lieu sur le Mac. Xcode peut signer avec une << Personal Team >>, c est-a-dire
# un Apple ID gratuit — mais il faut alors que l appareil soit joignable, par USB ou sur le
# meme reseau local. Un Mac dans le nuage ne peut ni l un ni l autre.
#
# LA SIGNATURE SE FAIT DONC SOUS WINDOWS, APRES LE BUILD, l iPhone branche en USB, par un
# outil de televersement (Sideloadly, AltStore). Le Mac distant ne fait que ce que lui seul
# sait faire : COMPILER. Voir docs/ios-sur-mon-iphone.md pour la marche a suivre complete.
#
# CE QUE LA VOIE GRATUITE COUTE EN CONTREPARTIE, et il faut le savoir avant :
#   - l application cesse de s ouvrir au bout de 7 JOURS, et il faut la reinstaller ;
#   - 3 applications televersees au maximum, en meme temps, sur le meme Apple ID ;
#   - une dizaine de nouveaux identifiants d application par semaine, plafond d Apple.
# Aucune de ces limites ne gene un test ; toutes les trois interdisent une distribution.
# C est exactement la frontiere que les 99 $ achetent.

workflows:
  # ---------------------------------------------------------------------------------
  # LA CHAINE GRATUITE : un .ipa non signe, a televerser soi-meme depuis Windows.
  # ---------------------------------------------------------------------------------
  talvex-ios-perso:
    name: Talvex iOS - non signe, pour mon iPhone
    instance_type: mac_mini_m2
    # Plus court que la chaine TestFlight : ni signature, ni envoi, ni attente d Apple.
    # Le plan gratuit de Codemagic donne 500 minutes de Mac mini M2 par mois.
    max_build_duration: 45

    environment:
      xcode: 26.6
      node: 24
      groups:
        # Les memes variables web que l autre chaine : sans elles, le paquet ne sait pas a
        # quel projet Supabase parler. AUCUNE variable Apple n est necessaire ici.
        - talvex_web
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      # PAS DE BLOC ios_signing, ET C EST TOUT L INTERET. Le declarer obligerait Codemagic a
      # chercher un certificat chez Apple, donc une adhesion payante. On archive sans signer
      # et on signe apres, sous Windows, avec un Apple ID gratuit.

    scripts:
      - name: Dependances npm
        # EN PREMIER : Package.swift pointe node_modules par un chemin relatif.
        script: npm ci

      - name: Paquet web
        script: npm run build

      - name: Synchronisation du projet iOS
        script: npx cap sync ios

      - name: Version alignee sur celle du produit
        script: node scripts/ios/synchroniserVersion.mjs

      - name: Controles de non-regression
        script: npm test

      - name: Archive NON SIGNEE
        # ON N EMPLOIE PAS `xcode-project build-ipa` ICI. Cet outil exporte une archive, et un
        # export demande toujours une identite de signature et un profil. Sans adhesion, il
        # s arrete. On appelle donc xcodebuild directement, en desarmant la signature par les
        # trois reglages que Xcode attend — les trois, car desarmer le seul CODE_SIGNING_ALLOWED
        # laisse encore la cible exiger une identite.
        script: |
          set -e
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$CM_BUILD_DIR/build/App.xcarchive" \
            -destination 'generic/platform=iOS' \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS=""

      - name: Emballage en .ipa
        # UN .ipa EST UNE ARCHIVE ZIP contenant un dossier `Payload` : rien de plus. On le
        # fabrique a la main parce qu on a saute l export, et un outil de televersement n en
        # demande pas davantage — il remplacera la signature lui-meme.
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          APP=$(find build/App.xcarchive/Products/Applications -maxdepth 1 -name '*.app' | head -1)
          if [ -z "$APP" ]; then echo "Aucun .app dans l archive : la compilation a echoue en silence."; exit 1; fi
          rm -rf build/Payload && mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          VERSION=$(node -e "process.stdout.write(require('./src-tauri/tauri.conf.json').version)")
          cd build && zip -qry "Talvex-$VERSION-non-signe.ipa" Payload
          echo "Produit : build/Talvex-$VERSION-non-signe.ipa"

    artifacts:
      - build/*.ipa
      - /tmp/xcodebuild_logs/*.log

    # AUCUN BLOC publishing. Rien ne part nulle part : l artefact se telecharge depuis
    # l interface de Codemagic, et c est tout ce qu on veut.

  # ---------------------------------------------------------------------------------
  # LA CHAINE PAYANTE : signee et envoyee sur TestFlight. En attente des 99 $/an.
  # ---------------------------------------------------------------------------------
  talvex-ios:
    name: Talvex iOS - TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      # Xcode 26.6 est l image par defaut annoncee par Codemagic au 06/09/2026. A relire
      # avant le premier lancement : les images bougent, et une version absente fait echouer
      # le build des la premiere seconde.
      xcode: 26.6
      node: 24
      groups:
        - talvex_web
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "fr.talvex.app"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: fr.talvex.app

    scripts:
      - name: Dependances npm
        # EN PREMIER : Package.swift pointe node_modules par un chemin relatif.
        script: npm ci

      - name: Paquet web
        script: npm run build

      - name: Synchronisation du projet iOS
        # Copie dist/ dans ios/App/App/public et met a jour Package.swift. Aucun pod.
        script: npx cap sync ios

      - name: Version alignee sur celle du produit
        # CFBundleVersion doit STRICTEMENT croitre : Apple refuse un numero deja televerse,
        # et le refus arrive apres l envoi. Le script derive 0.1.0 en 100, comme Android.
        script: node scripts/ios/synchroniserVersion.mjs

      - name: Controles de non-regression
        # On ne televerse pas une version dont les garde-fous sont rouges.
        script: npm test

      - name: Profils de provisionnement
        script: xcode-project use-profiles

      - name: Archive et IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        # TestFlight seulement : rien ne part vers l App Store sans decision explicite.
        submit_to_testflight: true
        # Aucun groupe externe : la distribution externe passe par une revue Apple.
        # Les testeurs internes, eux, recoivent la version en quelques minutes.
        submit_to_app_store: false
