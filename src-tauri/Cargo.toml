[package]
name = "talvex"
version = "0.1.0"
description = "Talvex CRM — application de bureau"
edition = "2021"
rust-version = "1.90"
# Le depot est PUBLIC : rien ici ne doit porter de secret.
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
# Valeurs par defaut de Tauri pour un binaire de release raisonnable.
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
